name: ip_setter
description: "IP Profile Switcher (NIC Quick-Config) for Windows, macOS, and Linux."
homepage: https://github.com/Tom-McGuire/IP-Switcher
repository: https://github.com/Tom-McGuire/IP-Switcher
publish_to: 'none'

version: 0.6.4+6

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  network_suite_shared:
    git:
      url: https://github.com/Tom-McGuire/network-suite-shared.git
      ref: main
  provider: ^6.1.5+1
  sqflite_common_ffi: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.6
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/icons/app_icon.png
